[workspace]
members = ["gaip-core", "gaip-engine", "gaip-broker", "gaip-bindings", "gaip-client"]
resolver = "2"

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Guilherme <guilherme.barcha@gmail.com>"]
repository = "https://github.com/mrschneider/gaip"

[workspace.dependencies]
gaip-core = { path = "gaip-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
rustls = "0.23"
signal-hook = "0.4"
rustls-pemfile = "2"

# Release binaries ship from CI on every tag: thin LTO crosses the
# crate boundary (core -> engine/broker/client) without the full-link cost,
# and codegen-units=1 keeps the inliner working across the hot wire path.
[profile.release]
lto = "thin"
codegen-units = 1
