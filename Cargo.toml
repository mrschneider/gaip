[workspace]
members = ["gaip-core", "gaip-engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Guilherme <guilherme.barcha@gmail.com>"]
repository = "https://github.com/mrschneider/gaip"

[workspace.dependencies]
gaip-core = { path = "gaip-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
