[package]
name = "gaip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GAIP — Agentic Interoperability Protocol: typed envelopes, six universal primitives, transport-agnostic framing"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
digest = "0.11"
hmac = { workspace = true }
sha2 = { workspace = true }
# std::HashMap is backed by hashbrown; its `Equivalent` trait (used by
# `HashMap::get`) is the trait `CompositeKey` must implement for the
# zero-copy hot-path lookup. Added as a direct dep so the impl path is
# explicit instead of reaching for a std-internal trait.
hashbrown = "0.17"
