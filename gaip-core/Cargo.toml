[package]
name = "gaip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GAIP — Agentic Interoperability Protocol: typed envelopes, six universal primitives, transport-agnostic framing"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
digest = "0.11"
hmac = { workspace = true }
sha2 = { workspace = true }
# hashbrown backs the dedupe cache's map; its `Equivalent` trait is what
# the borrowed `ProbeKey` lookup probe implements so a hot-path probe can
# hit the owned `(String, String)` key without allocating a combined key.
hashbrown = "0.17"

[dev-dependencies]
# Used only by the concurrency benchmark examples to measure the lock swap.
parking_lot = { workspace = true }
