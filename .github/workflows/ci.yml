name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  experiments:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: GIOP layer E2E
        run: python3 experiments/experiment_001_giop_layer.py
      - name: Broker E2E
        run: python3 experiments/experiment_002_broker.py
      - name: TLS E2E
        run: python3 experiments/experiment_005_tls.py
      - name: Robustness E2E
        run: python3 experiments/experiment_006_robustness.py

  transports:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: NATS E2E (real nats-server)
        run: bash experiments/experiment_003_nats.sh
      - name: gRPC E2E (real HTTP/2)
        run: bash experiments/experiment_004_grpc.sh
