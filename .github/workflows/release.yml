name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (the client integration test spawns the engine binary;
          experiments need the debug binaries)
        run: cargo build --workspace
      - name: Tests
        run: cargo test --workspace
      - name: GIOP layer E2E
        run: python3 experiments/experiment_001_giop_layer.py
      - name: Broker E2E
        run: python3 experiments/experiment_002_broker.py
      - name: TLS E2E
        run: python3 experiments/experiment_005_tls.py
      - name: Robustness E2E
        run: python3 experiments/experiment_006_robustness.py
      - name: NATS E2E (real nats-server)
        run: bash experiments/experiment_003_nats.sh
      - name: gRPC E2E (real HTTP/2)
        run: bash experiments/experiment_004_grpc.sh

  assets:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/gaip-engine dist/
          cp target/${{ matrix.target }}/release/gaip-broker dist/
          tar czf gaip-${{ matrix.target }}.tar.gz -C dist .
          sha256sum gaip-${{ matrix.target }}.tar.gz > gaip-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.target }}
          path: |
            gaip-${{ matrix.target }}.tar.gz
            gaip-${{ matrix.target }}.tar.gz.sha256

  publish:
    runs-on: ubuntu-latest
    needs: assets
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
